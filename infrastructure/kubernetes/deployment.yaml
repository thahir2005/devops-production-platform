apiVersion: apps/v1
kind: Deployment
metadata:
  name: production-reliability-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: production-reliability-api
  template:
    metadata:
      labels:
        app: production-reliability-api
    spec:
      containers:
        - name: production-reliability-api
          image: production-reliability-api:1.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 20

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"